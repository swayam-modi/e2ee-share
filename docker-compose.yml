services:
  web:
    build:
      context: ./apps/web-next
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    network_mode: host
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_certs:/etc/caddy/certs
    depends_on:
      - web
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles:
      - redis

volumes:
  caddy_data:
  caddy_certs:
